<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Notes</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea; --text: #1b1f24; --muted: #667085;
    --accent: #2457d6; --accent-soft: #e8eefc; --danger: #b42318;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45; }
  .top { background: var(--card); border-bottom: 1px solid var(--line); }
  .top-inner, main { max-width: 820px; margin: 0 auto; padding: 12px 16px; }
  .top-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.15rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .narrow { max-width: 420px; margin: 32px auto; }
  input, textarea, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: inherit; }
  .card input, .card textarea, dialog input, dialog textarea, dialog select { width: 100%; margin-top: 6px; }
  textarea { resize: vertical; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: #fff; padding: 7px 12px; color: inherit; }
  button:hover { background: #f0f2f5; }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d47b3; }
  button.link { border: none; background: none; color: var(--accent); padding: 2px 6px; }
  button.link:hover { text-decoration: underline; background: none; }
  button.link.danger { color: var(--danger); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tabs, .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .subtabs { margin-top: 2px; }
  .tabs button, .subtabs button { border-color: transparent; background: transparent; color: var(--muted); }
  .tabs button.active, .subtabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .bar input { width: auto; flex: 1; min-width: 160px; margin-top: 0; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; overflow-wrap: anywhere; }
  .item-head { display: flex; align-items: center; gap: 8px; }
  .item-title { font-weight: 600; }
  .sub-line { color: var(--muted); font-size: .9rem; }
  .item-body { margin-top: 4px; white-space: pre-wrap; }
  .item-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: .8rem; }
  .badge { background: var(--accent-soft); color: var(--accent); font-size: .75rem; padding: 1px 8px; border-radius: 999px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: #eef0f3; border-radius: 999px; padding: 1px 10px; font-size: .8rem; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }
  .more { display: block; margin: 4px auto 16px; }
  label.field { display: block; font-size: .85rem; color: var(--muted); margin-top: 10px; }
  .switch { margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .filterbar { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: min(440px, 92vw); }
  dialog::backdrop { background: rgba(0, 0, 0, .35); }
  dialog h3 { margin: 0 0 4px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1b1f24; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--danger); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Secure Notes</h1>
    <div id="userbar" class="hidden">
      <span id="who"></span>
      <button id="logoutBtn" class="link">Log out</button>
    </div>
  </div>
</header>

<main>
  <!-- Login / register -->
  <section id="auth" class="card narrow">
    <h2 id="authTitle">Log in</h2>
    <form id="authForm">
      <div id="regFields" class="hidden">
        <label class="field">Name <input id="name" autocomplete="name"></label>
        <label class="field">Interests (optional, comma separated) <input id="interests" placeholder="chess, reading"></label>
      </div>
      <label class="field">Email <input id="email" type="email" required autocomplete="email"></label>
      <label class="field">Password <input id="password" type="password" required minlength="8" autocomplete="current-password"></label>
      <p style="margin:14px 0 0"><button id="authSubmit" class="primary" type="submit">Log in</button></p>
    </form>
    <p class="switch"><span id="authSwitchText">New here?</span> <button id="authSwitch" class="link" type="button">Create an account</button></p>
  </section>

  <div id="app" class="hidden">
    <nav class="tabs" id="mainTabs">
      <button data-view="notes" class="active">Notes</button>
      <button data-view="posts">Posts</button>
      <button data-view="admin" id="adminTabBtn" class="hidden">Admin</button>
    </nav>

    <!-- Notes -->
    <section id="view-notes" class="view">
      <div class="card">
        <h2>New note</h2>
        <input id="noteTitle" placeholder="Title" maxlength="200">
        <textarea id="noteContent" rows="3" placeholder="Write something" maxlength="10000"></textarea>
        <p style="margin:10px 0 0"><button id="addNote" class="primary">Add note</button></p>
      </div>
      <div id="notes"></div>
      <button id="notesMore" class="more hidden">Load more</button>
    </section>

    <!-- Posts -->
    <section id="view-posts" class="view hidden">
      <div class="card">
        <h2>New post</h2>
        <input id="postTitle" placeholder="Title" maxlength="200">
        <textarea id="postContent" rows="3" placeholder="Share something with everyone" maxlength="10000"></textarea>
        <p style="margin:10px 0 0"><button id="addPost" class="primary">Publish post</button></p>
      </div>
      <div id="postsFilter" class="filterbar hidden">
        <span id="postsFilterLabel"></span>
        <button id="postsClear" class="link">Show all posts</button>
      </div>
      <div id="posts"></div>
      <button id="postsMore" class="more hidden">Load more</button>
    </section>

    <!-- Admin -->
    <section id="view-admin" class="view hidden">
      <nav class="subtabs" id="adminTabs">
        <button data-sub="users" class="active">Users</button>
        <button data-sub="notes">All notes</button>
        <button data-sub="groups">Interests</button>
      </nav>

      <div id="sub-users" class="sub">
        <div class="bar"><span class="meta">Newest users first</span><button id="addUserBtn" class="primary">Add user</button></div>
        <div id="users"></div>
        <button id="usersMore" class="more hidden">Load more</button>
      </div>

      <div id="sub-notes" class="sub hidden">
        <div id="allNotes"></div>
        <button id="allNotesMore" class="more hidden">Load more</button>
      </div>

      <div id="sub-groups" class="sub hidden">
        <div class="bar">
          <input id="interestFilter" placeholder="Filter by one interest (optional)">
          <button id="interestBtn">Show</button>
        </div>
        <div id="groups"></div>
        <button id="groupsMore" class="more hidden">Load more</button>
      </div>
    </section>
  </div>
</main>

<dialog id="dlg">
  <form id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgFields"></div>
    <div class="dlg-actions">
      <button type="button" id="dlgCancel">Cancel</button>
      <button type="submit" class="primary" id="dlgOk">Save</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const API_BASE = 'https://assesment-gamma-taupe.vercel.app';
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('token');
let me = null;

// ---------- helpers
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props);
  kids.flat().filter((k) => k != null && k !== false).forEach((k) => n.append(k));
  return n;
}
const fmt = (d) => new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const shortId = (id) => String(id).slice(-6);
const splitList = (s) => s.split(',').map((x) => x.trim()).filter(Boolean);

let toastTimer;
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3500);
}

async function run(fn, btn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) btn.disabled = false; }
}

function showLogin() {
  $('app').classList.add('hidden');
  $('userbar').classList.add('hidden');
  $('auth').classList.remove('hidden');
}

async function api(path, method = 'GET', body) {
  const res = await fetch(API_BASE + '/api' + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (res.status === 401 && token) {
    // Token expired or the user was removed: back to the login form.
    token = null;
    localStorage.removeItem('token');
    showLogin();
  }
  if (!res.ok) throw new Error((data && data.message) || res.statusText);
  return data;
}

// Dialog form. fields: [{ name, label, type, value, options, required }]. Resolves to values or null.
function askForm(title, fields, okLabel = 'Save') {
  return new Promise((resolve) => {
    const dlg = $('dlg');
    $('dlgTitle').textContent = title;
    $('dlgOk').textContent = okLabel;
    const box = $('dlgFields');
    box.replaceChildren();
    const inputs = {};
    for (const f of fields) {
      let input;
      if (f.options) {
        input = el('select');
        f.options.forEach((o) => input.append(el('option', { value: o, textContent: o })));
      } else if (f.type === 'textarea') {
        input = el('textarea', { rows: 4 });
      } else {
        input = el('input', { type: f.type || 'text' });
      }
      input.value = f.value || '';
      if (f.required) input.required = true;
      if (f.placeholder) input.placeholder = f.placeholder;
      inputs[f.name] = input;
      box.append(el('label', { className: 'field' }, f.label, input));
    }
    const finish = (result) => { if (dlg.open) dlg.close(); resolve(result); };
    $('dlgForm').onsubmit = (e) => {
      e.preventDefault();
      const out = {};
      for (const f of fields) out[f.name] = inputs[f.name].value;
      finish(out);
    };
    $('dlgCancel').onclick = () => finish(null);
    dlg.oncancel = () => resolve(null);
    dlg.showModal();
  });
}

// One list item. c: { title, badge, sub, body, chips, meta (string or node) }
function item(parent, c, actions = []) {
  const div = el('div', { className: 'item' },
    el('div', { className: 'item-head' },
      el('span', { className: 'item-title', textContent: c.title }),
      c.badge ? el('span', { className: 'badge', textContent: c.badge }) : null));
  if (c.sub) div.append(el('div', { className: 'sub-line', textContent: c.sub }));
  if (c.body) div.append(el('div', { className: 'item-body', textContent: c.body }));
  if (c.chips && c.chips.length) {
    div.append(el('div', { className: 'chips' }, c.chips.map((x) => el('span', { className: 'chip', textContent: x }))));
  }
  const foot = el('div', { className: 'item-foot' });
  if (c.meta) foot.append(typeof c.meta === 'string' ? el('span', { className: 'meta', textContent: c.meta }) : c.meta);
  if (actions.length) {
    const acts = el('div');
    for (const [label, fn, kind] of actions) {
      acts.append(el('button', {
        className: 'link ' + (kind || ''),
        textContent: label,
        onclick: (e) => run(fn, e.currentTarget),
      }));
    }
    foot.append(acts);
  }
  if (foot.childNodes.length) div.append(foot);
  parent.append(div);
}

// Cursor pagination helper: returns load(reset) and wires up the "Load more" button.
function pager(box, moreBtn, urlFor, renderItem, emptyText) {
  let cursor = null;
  async function load(reset) {
    if (reset) { cursor = null; box.replaceChildren(); }
    const base = urlFor();
    const q = new URLSearchParams({ limit: 5 });
    if (cursor) q.set('cursor', cursor);
    const page = await api(base + (base.includes('?') ? '&' : '?') + q);
    page.data.forEach((x) => renderItem(box, x));
    if (reset && page.data.length === 0) box.append(el('div', { className: 'empty', textContent: emptyText }));
    cursor = page.nextCursor;
    moreBtn.classList.toggle('hidden', !cursor);
  }
  moreBtn.onclick = (e) => run(() => load(false), e.currentTarget);
  return load;
}

// ---------- my notes
const notes = pager($('notes'), $('notesMore'), () => '/notes', (box, n) =>
  item(box, { title: n.title, body: n.content, meta: fmt(n.createdAt) }, [
    ['Edit', async () => {
      const v = await askForm('Edit note', [
        { name: 'title', label: 'Title', value: n.title, required: true },
        { name: 'content', label: 'Content', type: 'textarea', value: n.content },
      ]);
      if (!v) return;
      await api('/notes/' + n.id, 'PATCH', v);
      toast('Note updated');
      await notes(true);
    }],
    ['Delete', async () => {
      if (!confirm('Delete this note?')) return;
      await api('/notes/' + n.id, 'DELETE');
      toast('Note deleted');
      await notes(true);
    }, 'danger'],
  ]), 'No notes yet. Write your first one above.');

$('addNote').onclick = (e) => run(async () => {
  await api('/notes', 'POST', { title: $('noteTitle').value, content: $('noteContent').value });
  $('noteTitle').value = ''; $('noteContent').value = '';
  toast('Note added');
  await notes(true);
}, e.currentTarget);

// ---------- posts (click an author to see only their posts)
let postsFilter = null; // { id, name } or null

const posts = pager($('posts'), $('postsMore'),
  () => (postsFilter ? '/posts/user/' + encodeURIComponent(postsFilter.id) : '/posts'),
  (box, p) => {
    const name = p.authorName || (postsFilter && postsFilter.name) || 'user ' + shortId(p.author);
    const authorId = p.author || (postsFilter && postsFilter.id);
    const byline = postsFilter
      ? el('span', { className: 'meta', textContent: fmt(p.createdAt) })
      : el('span', { className: 'meta' }, fmt(p.createdAt), ' by ',
          el('button', {
            className: 'link', textContent: name, title: 'Show only their posts',
            onclick: () => run(() => filterPosts({ id: authorId, name })),
          }));
    item(box, { title: p.title, body: p.content, meta: byline });
  }, 'No posts here yet.');

async function filterPosts(f) {
  postsFilter = f;
  $('postsFilter').classList.toggle('hidden', !f);
  if (f) $('postsFilterLabel').textContent = 'Showing posts by ' + f.name;
  await posts(true);
}
$('postsClear').onclick = (e) => run(() => filterPosts(null), e.currentTarget);

$('addPost').onclick = (e) => run(async () => {
  await api('/posts', 'POST', { title: $('postTitle').value, content: $('postContent').value });
  $('postTitle').value = ''; $('postContent').value = '';
  toast('Post published');
  await posts(true);
}, e.currentTarget);

// ---------- admin: users
const users = pager($('users'), $('usersMore'), () => '/users', (box, u) =>
  item(box, { title: u.name, badge: u.role, sub: u.email, chips: u.interests, meta: 'Joined ' + fmt(u.createdAt) }, [
    ['Edit', async () => {
      const v = await askForm('Edit user', [
        { name: 'name', label: 'Name', value: u.name, required: true },
        { name: 'email', label: 'Email', type: 'email', value: u.email, required: true },
        { name: 'role', label: 'Role', options: ['user', 'admin'], value: u.role },
        { name: 'interests', label: 'Interests (comma separated)', value: u.interests.join(', ') },
        { name: 'password', label: 'New password (leave empty to keep)', type: 'password' },
      ]);
      if (!v) return;
      const body = { name: v.name, email: v.email, role: v.role, interests: splitList(v.interests) };
      if (v.password) body.password = v.password;
      await api('/users/' + u.id, 'PATCH', body);
      toast('User updated');
      await users(true);
    }],
    ['Delete', async () => {
      if (!confirm('Delete ' + u.email + ' and all their notes and posts?')) return;
      await api('/users/' + u.id, 'DELETE');
      toast('User deleted');
      await users(true);
    }, 'danger'],
  ]), 'No users found.');

$('addUserBtn').onclick = (e) => run(async () => {
  const v = await askForm('Add user', [
    { name: 'name', label: 'Name', required: true },
    { name: 'email', label: 'Email', type: 'email', required: true },
    { name: 'password', label: 'Password (min 8 characters)', type: 'password', required: true },
    { name: 'role', label: 'Role', options: ['user', 'admin'], value: 'user' },
    { name: 'interests', label: 'Interests (comma separated)' },
  ], 'Add user');
  if (!v) return;
  await api('/users', 'POST', { ...v, interests: splitList(v.interests) });
  toast('User added');
  await users(true);
}, e.currentTarget);

// ---------- admin: all notes (shows the owner's name)
const allNotes = pager($('allNotes'), $('allNotesMore'), () => '/notes/all', (box, n) =>
  item(box, {
    title: n.title,
    body: n.content,
    meta: fmt(n.createdAt) + ', by ' + (n.ownerName || 'user ' + shortId(n.owner)),
  }), 'Nobody has written a note yet.');

// ---------- admin: interests aggregation
const groups = pager($('groups'), $('groupsMore'),
  () => {
    const v = $('interestFilter').value.trim();
    return '/users/by-interests' + (v ? '?interest=' + encodeURIComponent(v) : '');
  },
  (box, g) => {
    const names = g.users.map((u) => u.name);
    if (g.count > names.length) names.push('+' + (g.count - names.length) + ' more');
    item(box, { title: g.interest, badge: g.count + (g.count === 1 ? ' user' : ' users'), chips: names });
  }, 'No users have that interest.');
$('interestBtn').onclick = (e) => run(() => groups(true), e.currentTarget);
$('interestFilter').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('interestBtn').click(); });

// ---------- navigation
const adminLoaders = { users: () => users(true), notes: () => allNotes(true), groups: () => groups(true) };
const adminLoaded = {};

function setAdminTab(name) {
  document.querySelectorAll('#adminTabs button').forEach((b) => b.classList.toggle('active', b.dataset.sub === name));
  document.querySelectorAll('.sub').forEach((s) => s.classList.toggle('hidden', s.id !== 'sub-' + name));
  if (!adminLoaded[name]) { adminLoaded[name] = true; run(adminLoaders[name]); }
}

function setView(name) {
  document.querySelectorAll('#mainTabs button').forEach((b) => b.classList.toggle('active', b.dataset.view === name));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('hidden', v.id !== 'view-' + name));
  if (name === 'admin') setAdminTab(document.querySelector('#adminTabs button.active').dataset.sub);
}

document.querySelectorAll('#mainTabs button').forEach((b) => { b.onclick = () => setView(b.dataset.view); });
document.querySelectorAll('#adminTabs button').forEach((b) => { b.onclick = () => setAdminTab(b.dataset.sub); });

// ---------- auth
let mode = 'login';
function setMode(m) {
  mode = m;
  const reg = m === 'register';
  $('regFields').classList.toggle('hidden', !reg);
  $('name').required = reg;
  $('authTitle').textContent = reg ? 'Create an account' : 'Log in';
  $('authSubmit').textContent = reg ? 'Register' : 'Log in';
  $('authSwitchText').textContent = reg ? 'Already registered?' : 'New here?';
  $('authSwitch').textContent = reg ? 'Log in' : 'Create an account';
  $('password').autocomplete = reg ? 'new-password' : 'current-password';
}
$('authSwitch').onclick = () => setMode(mode === 'login' ? 'register' : 'login');

$('authForm').onsubmit = (e) => {
  e.preventDefault();
  run(async () => {
    const body = { email: $('email').value, password: $('password').value };
    if (mode === 'register') {
      body.name = $('name').value;
      body.interests = splitList($('interests').value);
    }
    const data = await api(mode === 'register' ? '/auth/register' : '/auth/login', 'POST', body);
    token = data.token;
    localStorage.setItem('token', token);
    $('password').value = '';
    await start();
  }, e.submitter);
};

$('logoutBtn').onclick = () => { localStorage.removeItem('token'); location.reload(); };

async function start() {
  me = (await api('/auth/me')).user;
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('userbar').classList.remove('hidden');
  $('who').textContent = me.name + ' (' + me.role + ')';
  $('adminTabBtn').classList.toggle('hidden', me.role !== 'admin');
  setView('notes');
  await Promise.all([notes(true), posts(true)]);
}

if (token) run(start);
</script>
</body>
</html>
