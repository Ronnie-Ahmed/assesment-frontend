<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Notes</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dde1e6; --accent:#2f5bea; --err:#b3261e; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: #1c1e21; max-width: 860px; margin: 0 auto; padding: 16px; line-height: 1.45; }
  h1 { font-size: 1.4rem; margin: 8px 0; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  h3 { font-size: 1rem; margin: 16px 0 6px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 12px 0; }
  input, select { padding: 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; margin: 3px 0; max-width: 100%; }
  button { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font: inherit; margin: 3px 2px; }
  button:hover { background: #f0f2f5; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .item { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; overflow-wrap: anywhere; }
  .item .title { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: .8rem; margin-bottom: 2px; }
  .empty { color: var(--muted); padding: 6px 0; }
  #msg { min-height: 1.4em; }
  .err { color: var(--err); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>Secure Notes</h1>
<p id="msg" class="err" role="alert"></p>

<section id="auth">
  <h2>Log in or register</h2>
  <input id="name" placeholder="Name (register only)" autocomplete="name">
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="password" type="password" placeholder="Password (min 8 characters)" autocomplete="current-password">
  <input id="interests" placeholder="Interests, comma separated (register only)">
  <div>
    <button id="loginBtn">Log in</button>
    <button id="registerBtn">Register</button>
  </div>
</section>

<div id="app" class="hidden">
  <p>Logged in as <b id="who"></b> <button id="logoutBtn">Log out</button></p>

  <div class="tabs">
    <button data-tab="tab-notes" class="active">Notes</button>
    <button data-tab="tab-posts">Posts</button>
    <button data-tab="tab-admin" id="adminTabBtn" class="hidden">Admin</button>
  </div>

  <section id="tab-notes" class="tab">
    <h2>My notes</h2>
    <input id="noteTitle" placeholder="Title">
    <input id="noteContent" placeholder="Content">
    <button id="addNote">Add note</button>
    <div id="notes"></div>
    <button id="notesMore" class="hidden">Load more</button>
  </section>

  <section id="tab-posts" class="tab hidden">
    <h2>Posts (public)</h2>
    <input id="postTitle" placeholder="Title">
    <input id="postContent" placeholder="Content">
    <button id="addPost">Add post</button>
    <div id="posts"></div>
    <button id="postsMore" class="hidden">Load more</button>
    <h3>Posts by user</h3>
    <input id="postsUserId" placeholder="User id">
    <button id="postsUserBtn">Show posts</button>
    <div id="userPosts"></div>
    <button id="userPostsMore" class="hidden">Load more</button>
  </section>

  <div id="tab-admin" class="tab hidden">
    <section>
      <h2>Admin: users</h2>
      <input id="uName" placeholder="Name">
      <input id="uEmail" type="email" placeholder="Email">
      <input id="uPassword" type="password" placeholder="Password" autocomplete="new-password">
      <select id="uRole"><option>user</option><option>admin</option></select>
      <button id="addUser">Add user</button>
      <div id="users"></div>
      <button id="usersMore" class="hidden">Load more</button>
    </section>

    <section>
      <h2>Admin: all notes</h2>
      <div id="allNotes"></div>
      <button id="allNotesMore" class="hidden">Load more</button>
    </section>

    <section>
      <h2>Admin: users grouped by interests</h2>
      <input id="interestFilter" placeholder="Filter by one interest (optional)">
      <button id="interestBtn">Show groups</button>
      <div id="groups"></div>
      <button id="groupsMore" class="hidden">Load more</button>
    </section>
  </div>
</div>

<script>
const API_BASE = 'https://assesment-gamma-taupe.vercel.app';
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('token');
let me = null;

function showLogin() {
  $('app').classList.add('hidden');
  $('auth').classList.remove('hidden');
}

async function api(path, method = 'GET', body) {
  const res = await fetch(API_BASE + '/api' + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (res.status === 401 && token) {
    // Token expired or user removed: go back to the login form.
    token = null;
    localStorage.removeItem('token');
    showLogin();
  }
  if (!res.ok) throw new Error((data && data.message) || res.statusText);
  return data;
}

async function run(fn) {
  $('msg').textContent = '';
  try { await fn(); } catch (e) { $('msg').textContent = e.message; }
}

const fmt = (d) => new Date(d).toLocaleString();

// content: a plain string, or { title, body, meta }
function row(parent, content, actions = []) {
  const div = document.createElement('div');
  div.className = 'item';
  if (typeof content === 'string') {
    div.append(document.createTextNode(content));
  } else {
    if (content.meta) {
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = content.meta;
      div.append(m);
    }
    const t = document.createElement('div');
    t.className = 'title';
    t.textContent = content.title;
    div.append(t);
    if (content.body) {
      const b = document.createElement('div');
      b.textContent = content.body;
      div.append(b);
    }
  }
  for (const [label, fn] of actions) {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.onclick = () => run(fn);
    div.append(btn);
  }
  parent.append(div);
}

// Cursor pagination helper: returns load(reset) and wires up the "Load more" button.
function pager(box, moreBtn, urlFor, renderItem, emptyText = 'Nothing here yet.') {
  let cursor = null;
  async function load(reset) {
    if (reset) { cursor = null; box.replaceChildren(); }
    const base = urlFor();
    const q = new URLSearchParams({ limit: 5 });
    if (cursor) q.set('cursor', cursor);
    const page = await api(base + (base.includes('?') ? '&' : '?') + q);
    page.data.forEach((item) => renderItem(box, item));
    if (reset && page.data.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = emptyText;
      box.append(e);
    }
    cursor = page.nextCursor;
    moreBtn.classList.toggle('hidden', !cursor);
  }
  moreBtn.onclick = () => run(() => load(false));
  return load;
}

// ---- my notes
const notes = pager($('notes'), $('notesMore'), () => '/notes', (box, n) =>
  row(box, { title: n.title, body: n.content, meta: fmt(n.createdAt) }, [
    ['Edit', async () => {
      const title = prompt('Title', n.title); if (title === null) return;
      const content = prompt('Content', n.content); if (content === null) return;
      await api('/notes/' + n.id, 'PATCH', { title, content });
      await notes(true);
    }],
    ['Delete', async () => { await api('/notes/' + n.id, 'DELETE'); await notes(true); }],
  ]), 'No notes yet. Add your first one above.');

$('addNote').onclick = () => run(async () => {
  await api('/notes', 'POST', { title: $('noteTitle').value, content: $('noteContent').value });
  $('noteTitle').value = ''; $('noteContent').value = '';
  await notes(true);
});

// ---- posts
const posts = pager($('posts'), $('postsMore'), () => '/posts', (box, p) =>
  row(box, { title: p.title, body: p.content, meta: fmt(p.createdAt) + ', author id ' + p.author }),
  'No posts yet. Write the first one above.');

$('addPost').onclick = () => run(async () => {
  await api('/posts', 'POST', { title: $('postTitle').value, content: $('postContent').value });
  $('postTitle').value = ''; $('postContent').value = '';
  await posts(true);
});

const userPosts = pager($('userPosts'), $('userPostsMore'),
  () => '/posts/user/' + encodeURIComponent($('postsUserId').value.trim()),
  (box, p) => row(box, { title: p.title, body: p.content, meta: fmt(p.createdAt) }),
  'This user has no posts.');
$('postsUserBtn').onclick = () => run(() => userPosts(true));

// ---- admin: users
const users = pager($('users'), $('usersMore'), () => '/users', (box, u) =>
  row(box, `${u.name} <${u.email}> [${u.role}] interests: ${u.interests.join(', ')} | id: ${u.id}`, [
    ['Edit', async () => {
      const name = prompt('Name', u.name); if (name === null) return;
      const role = prompt('Role (user/admin)', u.role); if (role === null) return;
      await api('/users/' + u.id, 'PATCH', { name, role });
      await users(true);
    }],
    ['Delete', async () => {
      if (!confirm('Delete ' + u.email + ' and all their notes and posts?')) return;
      await api('/users/' + u.id, 'DELETE');
      await users(true);
    }],
  ]), 'No users found.');

$('addUser').onclick = () => run(async () => {
  await api('/users', 'POST', {
    name: $('uName').value, email: $('uEmail').value,
    password: $('uPassword').value, role: $('uRole').value,
  });
  ['uName', 'uEmail', 'uPassword'].forEach((id) => ($(id).value = ''));
  await users(true);
});

// ---- admin: all notes
const allNotes = pager($('allNotes'), $('allNotesMore'), () => '/notes/all', (box, n) =>
  row(box, { title: n.title, body: n.content, meta: fmt(n.createdAt) + ', owner id ' + n.owner }),
  'No notes have been written yet.');

// ---- admin: interests aggregation
const groups = pager($('groups'), $('groupsMore'),
  () => {
    const v = $('interestFilter').value.trim();
    return '/users/by-interests' + (v ? '?interest=' + encodeURIComponent(v) : '');
  },
  (box, g) => row(box, `${g.interest} (${g.count}): ${g.users.map((u) => u.name).join(', ')}`),
  'No users have that interest.');
$('interestBtn').onclick = () => run(() => groups(true));

// ---- auth + startup
async function authenticate(path, body) {
  const data = await api(path, 'POST', body);
  token = data.token;
  localStorage.setItem('token', token);
  await start();
}

$('loginBtn').onclick = () => run(() =>
  authenticate('/auth/login', { email: $('email').value, password: $('password').value }));

$('registerBtn').onclick = () => run(() =>
  authenticate('/auth/register', {
    name: $('name').value, email: $('email').value, password: $('password').value,
    interests: $('interests').value.split(',').map((s) => s.trim()).filter(Boolean),
  }));

$('logoutBtn').onclick = () => { localStorage.removeItem('token'); location.reload(); };

async function start() {
  me = (await api('/auth/me')).user;
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent = `${me.email} (${me.role})`;
  $('adminTabBtn').classList.toggle('hidden', me.role !== 'admin');
  document.querySelector('.tabs button').click(); // always open on the Notes tab
  await Promise.all([notes(true), posts(true)]);
  if (me.role === 'admin') await Promise.all([users(true), allNotes(true), groups(true)]);
}

// ---- tabs and keyboard
document.querySelectorAll('.tabs button').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('hidden', t.id !== btn.dataset.tab));
  };
});

['email', 'password'].forEach((id) =>
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); }));

if (token) run(start);
</script>
</body>
</html>
